<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>فرم ورود </title>
  <link rel="stylesheet" href="./bootstrap/FILE_76c534a7-daf5-4886-a2ac-49315e4f8dcc.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="website icon" type="png" href="./picture/logo.png">

  <style>
    * {
      font-family: b koodak;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    :root {
      --primary: #1ac7db;
      --primary-dark: #0f9aab;
      --primary-light: #a1e5f0;
      --gray-bg: #f8fafc;
    }
    
    body {
      background: linear-gradient(135deg, var(--primary-light) 0%, #e0f2f7 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .login-container {
      max-width: 450px;
      width: 100%;
    }
    
    .login-card {
      background: white;
      border-radius: 35px;
      padding: 40px 35px;
      box-shadow: 0 25px 50px -12px rgba(26,199,219,0.4);
      border: 1px solid rgba(26,199,219,0.2);
      transition: transform 0.3s ease;
    }
    
    .login-card:hover {
      transform: translateY(-5px);
    }
    
    .login-header {
      text-align: center;
      margin-bottom: 35px;
    }
    
    .login-logo {
      width: 80px;
      height: 80px;
      background: linear-gradient(145deg, var(--primary), var(--primary-dark));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      box-shadow: 0 10px 20px rgba(26,199,219,0.3);
    }
    
    .login-logo i {
      font-size: 40px;
      color: white;
    }
    
    .login-header h2 {
      font-weight: 700;
      color: #1e3e45;
      margin-bottom: 8px;
    }
    
    .login-header p {
      color: #7f8c8d;
      font-size: 0.9rem;
    }
    
    .form-group {
      margin-bottom: 25px;
    }
    
    .form-group label {
      display: block;
      margin-bottom: 10px;
      font-weight: 600;
      color: #2c5f6b;
    }
    
    .input-group-custom {
      position: relative;
    }
    
    .input-group-custom i {
      position: absolute;
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--primary);
      font-size: 1.1rem;
      z-index: 1;
    }
    
    .input-group-custom input {
      width: 100%;
      padding: 14px 50px 14px 18px;
      border: 2px solid #e0e6ed;
      border-radius: 50px;
      font-size: 1rem;
      transition: all 0.3s;
      background: #f9fbfd;
    }
    
    .input-group-custom input:focus {
      outline: none;
      border-color: var(--primary);
      background: white;
      box-shadow: 0 0 0 4px rgba(26,199,219,0.1);
    }
    
    .password-toggle {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: #95a5a6;
      transition: 0.2s;
      z-index: 1;
    }
    
    .password-toggle:hover {
      color: var(--primary);
    }
    
    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      flex-wrap: wrap;
      gap: 10px;
    }
    
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      color: #2c5f6b;
      font-size: 0.9rem;
    }
    
    .checkbox-label input {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: var(--primary);
    }
    
    .forgot-link {
      color: var(--primary);
      text-decoration: none;
      font-size: 0.9rem;
      transition: 0.2s;
    }
    
    .forgot-link:hover {
      color: var(--primary-dark);
      text-decoration: underline;
    }
    
    .login-btn {
      width: 100%;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      border: none;
      padding: 14px;
      border-radius: 50px;
      font-weight: 700;
      font-size: 1.1rem;
      color: #022e36;
      transition: 0.3s;
      margin-bottom: 20px;
    }
    
    .login-btn:hover {
      transform: scale(1.02);
      box-shadow: 0 10px 25px rgba(26,199,219,0.4);
      color: #011a1f;
    }
    
    .divider {
      text-align: center;
      position: relative;
      margin: 25px 0;
    }
    
    .divider::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 1px;
      background: #e0e6ed;
    }
    
    .divider span {
      background: white;
      padding: 0 15px;
      position: relative;
      color: #95a5a8;
      font-size: 0.9rem;
    }
    
    .social-login {
      display: flex;
      gap: 15px;
      justify-content: center;
    }
    
    .social-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: 2px solid #e0e6ed;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.3s;
      text-decoration: none;
      color: #2c5f6b;
    }
    
    .social-btn:hover {
      border-color: var(--primary);
      transform: translateY(-3px);
      box-shadow: 0 5px 15px rgba(26,199,219,0.2);
    }
    
    .social-btn i {
      font-size: 1.3rem;
    }
    
    .register-link {
      text-align: center;
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px solid #e0e6ed;
    }
    
    .register-link p {
      color: #7f8c8d;
    }
    
    .register-link a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }
    
    .register-link a:hover {
      text-decoration: underline;
    }
    
    .error-message {
      color: #ff4757;
      font-size: 0.8rem;
      margin-top: 8px;
      margin-right: 15px;
      display: none;
    }
    
    @media (max-width: 480px) {
      .login-card {
        padding: 30px 20px;
      }
      .form-options {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <div class="login-logo">
        <img src="./picture/logo3.png" style="max-height:50% ;" alt="">
      </div>
      <h2>خوش آمدید</h2>
      <p>وارد حساب کاربری خود شوید</p>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label>ایمیل یا شماره موبایل</label>
        <div class="input-group-custom">
          <i class="fas fa-envelope"></i>
          <input type="text" id="username" placeholder="example@gmail.com" autocomplete="off">
        </div>
        <div class="error-message" id="usernameError">لطفا ایمیل یا شماره موبایل را وارد کنید</div>
      </div>

      <div class="form-group">
        <label>رمز عبور</label>
        <div class="input-group-custom">
          
          <input type="password" id="password" placeholder="••••••••">
          <i class="fas fa-eye password-toggle" id="togglePassword"></i>
        </div>
        <div class="error-message" id="passwordError">رمز عبور باید حداقل ۶ کاراکتر باشد</div>
      </div>

      <div class="form-options">
        <label class="checkbox-label">
          <input type="checkbox" id="rememberMe"> مرا به خاطر بسپار
        </label>
        <a href="#" class="forgot-link">رمز عبور را فراموش کرده‌اید؟</a>
      </div>

      <button type="submit" class="login-btn">ورود</button>
    </form>

    <div class="divider">
      <span>یا ورود با</span>
    </div>

    <div class="social-login">
      <a href="#" class="social-btn"><i class="fab fa-google"></i></a>
      <a href="#" class="social-btn"><i class="fab fa-instagram"></i></a>
      <a href="#" class="social-btn"><i class="fab fa-telegram"></i></a>
    </div>

    <div class="register-link">
      <p>حساب کاربری ندارید؟ <a href="./register.html" id="registerLink">ثبت‌نام کنید</a></p>
    </div>
  </div>
</div>

<script>
  // نمایش/مخفی کردن رمز عبور
  const togglePassword = document.getElementById('togglePassword');
  const passwordInput = document.getElementById('password');
  
  togglePassword.addEventListener('click', function() {
    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
    passwordInput.setAttribute('type', type);
    this.classList.toggle('fa-eye-slash');
  });
  
  // اعتبارسنجی فرم
  const loginForm = document.getElementById('loginForm');
  const username = document.getElementById('username');
  const usernameError = document.getElementById('usernameError');
  const password = document.getElementById('password');
  const passwordError = document.getElementById('passwordError');
  
  loginForm.addEventListener('submit', function(e) {
    e.preventDefault();
    let isValid = true;
    
    // اعتبارسنجی نام کاربری
    if (username.value.trim() === '') {
      usernameError.style.display = 'block';
      isValid = false;
    } else {
      usernameError.style.display = 'none';
    }
    
    // اعتبارسنجی رمز عبور
    if (password.value.length < 6) {
      passwordError.style.display = 'block';
      isValid = false;
    } else {
      passwordError.style.display = 'none';
    }
    
    if (isValid) {
      // نمایش نوتیفیکیشن موفقیت
      const successDiv = document.createElement('div');
      successDiv.textContent = 'ورود با موفقیت انجام شد!';
      successDiv.style.cssText = `
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: #1ac7db;
        color: white;
        padding: 12px 30px;
        border-radius: 50px;
        z-index: 1000;
        font-weight: 500;
        animation: fadeInOut 3s ease forwards;
      `;
      document.body.appendChild(successDiv);
      
      setTimeout(() => {
        successDiv.remove();
      }, 3000);
      
      // ذخیره در localStorage اگر "مرا به خاطر بسپار" فعال باشد
      if (document.getElementById('rememberMe').checked) {
        localStorage.setItem('rememberedUser', username.value);
      } else {
        localStorage.removeItem('rememberedUser');
      }

    }
  });
  
  // بارگذاری کاربر ذخیره شده
  const rememberedUser = localStorage.getItem('rememberedUser');
  if (rememberedUser) {
    username.value = rememberedUser;
    document.getElementById('rememberMe').checked = true;
  }

  // انیمیشن fadeInOut
  const style = document.createElement('style');
  style.textContent = `
    @keyframes fadeInOut {
      0% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
      15% { opacity: 1; transform: translateX(-50%) translateY(0); }
      85% { opacity: 1; transform: translateX(-50%) translateY(0); }
      100% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
    }
  `;
  document.head.appendChild(style);
</script>
<script src="./bootstrap/FILE_f4080421-dc4a-48f4-b9b7-514e78521c84.js"></script>
</body>
</html>
