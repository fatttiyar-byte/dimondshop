<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>گردونه شانس چرخشی | مسابقه جایزه</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="./bootstrap/FILE_76c534a7-daf5-4886-a2ac-49315e4f8dcc.css">
  <style>
    @font-face {
      font-family: b koodak;
      src: url(./font/B-Koodak-Fontjo.com/B\ Koodak\ Bold.ttf);
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family:b koodak;
    }

    body {
      background: linear-gradient(145deg, #4fbbc5 0%, #313433 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* کانتینر اصلی گردونه */
    .wheel-card {
      background: rgba(124, 120, 120, 0.35);
      backdrop-filter: blur(6px);
      border-radius: 70px;
      padding: 20px 20px 35px;
      box-shadow: 0 35px 65px rgba(0, 0, 0, 0.4), inset 0 1px 2px rgba(255,255,255,0.1);
      border: 1px solid rgba(255,215,150,0.5);
      transition: all 0.2s;
    }

    .wheel-wrapper {
      position: relative;
      width: min(85vw, 85vh, 520px);
      height: min(85vw, 85vh, 520px);
      margin: 0 auto;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100% !important;
      height: 100% !important;
      border-radius: 50%;
      box-shadow: 0 20px 35px rgba(0, 0, 0, 0.5), 0 0 0 8px #97dee5, 0 0 0 12px #101010;
      transition: filter 0.2s;
    }

    /* نوک نشانگر (پیکان ثابت) */
    .pointer-fixed {
      position: absolute;
      top: -32px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 28px solid transparent;
      border-right: 28px solid transparent;
      border-top: 58px solid #263f3e;
      filter: drop-shadow(0 6px 10px rgba(84, 81, 81, 0.4));
      z-index: 15;
    }
    .pointer-fixed::after {
      content: "✨";
      position: absolute;
      top: -60px;
      left: -14px;
      font-size: 25px;
      color: #ffffff;
      text-shadow: 0 2px 5px rgb(71, 68, 68);
    }

    /* دکمه وسط گردونه */
    .spin-center-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 110px;
      height: 110px;
      background: radial-gradient(circle, #a9e3d9, #b5f9ff);
      border-radius: 50%;
      border: 4px solid #343331;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
      cursor: pointer;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 1.2rem;
      color: #1c3aa5;
      transition: 0.1s linear;
      backdrop-filter: blur(2px);
    }
    .spin-center-btn:active {
      transform: translate(-50%, -50%) scale(0.94);
    }
    .spin-center-btn i {
      font-size: 2.2rem;
      margin-bottom: 4px;
      color: #000000;
    }

    /* پنل نتیجه و جوایز */
    .result-panel {
      background: #fffef7;
      border-radius: 55px;
      padding: 20px 22px;
      margin-top: 30px;
      text-align: center;
      box-shadow: 0 12px 28px rgba(94, 89, 89, 0.25);
      border: 1px solid #ffddb0;
    }
    .prize-label {
      font-size: 1rem;
      color: #000000;
      letter-spacing: 1px;
      font-weight: 500;
    }
    .prize-value {
      font-size: 1.9rem;
      font-weight: 800;
      background: linear-gradient(135deg, #444343, #807d7d);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      margin: 8px 0;
    }
    .coupon-box {
      background: #78d9d3;
      border-radius: 80px;
      padding: 10px 18px;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-family: monospace;
      font-weight: bold;
      direction: ltr;
      font-size: 1.2rem;
      margin-top: 6px;
    }
    .copy-btn {
      background: #b6bcbd;
      border: none;
      border-radius: 40px;
      padding: 6px 16px;
      font-weight: bold;
      color: #022e36;
      transition: 0.2s;
    }
    .history-area {
      margin-top: 22px;
      background: #ffffff;
      border-radius: 45px;
      padding: 12px 15px;
    }
    .history-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: #3b3a39;
    }
    .history-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 10px;
      max-height: 90px;
      overflow-y: auto;
    }
    .history-badge {
      background: #5dd0da;
      border-radius: 50px;
      padding: 5px 15px;
      font-size: 0.75rem;
      font-weight: 500;
      color: #404040;
    }
    button {
      cursor: pointer;
      font-family: 'Vazirmatn', sans-serif;
    }
    @media (max-width: 550px) {
      .wheel-card { padding: 12px 12px 25px; border-radius: 45px; }
      .spin-center-btn { width: 80px; height: 80px; font-size: 0.9rem; }
      .spin-center-btn i { font-size: 1.7rem; }
      .prize-value { font-size: 1.5rem; }
      .coupon-box { font-size: 0.9rem; padding: 5px 12px; }
      .pointer-fixed { border-left: 20px solid transparent; border-right: 20px solid transparent; border-top: 42px solid #ffd966; top: -24px; }
      .pointer-fixed::after { font-size: 18px; top: -44px; left: -10px; }
    }
    @keyframes pulse {
      0% { text-shadow: 0 0 0 rgba(255,215,0,0);}
      100% { text-shadow: 0 0 12px gold; }
    }
    .glow-text {
      animation: pulse 0.5s ease-in-out 2;
    }
  </style>
</head>
<body>

<div class="wheel-card">
  <div class="wheel-wrapper">
    <canvas id="wheelCanvas" width="550" height="550"></canvas>
    <div class="pointer-fixed"></div>
    <div class="spin-center-btn" id="spinButton">
      <i class="fas fa-arrow-rotate-right"></i>
      <span>بچرخون</span>
    </div>
  </div>

  <div class="result-panel">
    <div class="prize-label"><i class="fas fa-gift"></i> جایزه برنده شده</div>
    <div class="prize-value" id="prizeDisplay">—</div>
    <div id="couponContainer" style="min-height: 68px;"></div>
  </div>

  <div class="history-area">
    <div class="history-title"><i class="fas fa-clock"></i> برندگان اخیر</div>
    <div class="history-badges" id="historyList">
      <span class="history-badge">هنوز برنده‌ای ثبت نشده</span>
    </div>
  </div>
</div>

<script>
  (function() {
    // ---------- جوایز گردونه (رنگ‌های شاد) ----------
    const SEGMENTS = [
      { name: "۲۰٪ تخفیف",  value: "۲۰٪ تخفیف ویژه",  color: "#fff",   coupon: "LUCK20" },
      { name: "۵۰٪ تخفیف",  value: "۵۰٪ تخفیف",      color: "#1ac7db",   coupon: "MEGA50" },
      { name: "۱۰٪ تخفیف",  value: "۱۰٪ تخفیف",      color: "#fff",   coupon: "SAVE10" },
      { name: "ارسال رایگان", value: "ارسال رایگان", color: "#1ac7db",   coupon: "FREE_POST" },
      { name: "۳۰٪ تخفیف",  value: "۳۰٪ تخفیف سوپر", color: "#fff",   coupon: "SUPER30" },
      { name: "کارت هدیه ۵۰ک", value: "کارت هدیه ۵۰ هزارتومانی", color: "#1ac7db", coupon: "GIFT50K" },
      { name: "۵٪ تخفیف",   value: "۵٪ تخفیف",        color: "#fff",   coupon: "WELCOME5" },
      { name: "چرخش مجدد",  value: "شانس دوباره 🎡",   color: "#1ac7db",   coupon: "AGAIN" }
    ];
    const SEGMENT_COUNT = SEGMENTS.length;
    const ANGLE_PER_SEG = (Math.PI * 2) / SEGMENT_COUNT;
    
    // ----- DOM elements -----
    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    const prizeDisplay = document.getElementById('prizeDisplay');
    const couponContainer = document.getElementById('couponContainer');
    const historyListDiv = document.getElementById('historyList');
    const spinBtn = document.getElementById('spinButton');
    
    // وضعیت گردونه
    let currentRotation = 0;        // رادیان چرخش فعلی
    let isSpinning = false;
    let animFrame = null;
    let spinStartTime = 0;
    let spinDuration = 2000;         // 2 ثانیه
    let startRot = 0;
    let targetRot = 0;
    
    // تاریخچه برنده‌ها (localStorage)
    let winnersHistory = [];
    
    // ---- resize ریسپانسیو ----
    function resizeCanvasSize() {
      const container = document.querySelector('.wheel-wrapper');
      if (!container) return;
      const size = container.clientWidth;
      canvas.width = size;
      canvas.height = size;
      canvas.style.width = `${size}px`;
      canvas.style.height = `${size}px`;
      drawWheel();
    }
    
    // رسم گردونه با زاویه currentRotation
    function drawWheel() {
      if (!ctx) return;
      const w = canvas.width;
      const h = canvas.height;
      const centerX = w / 2;
      const centerY = h / 2;
      const radius = w / 2 - 6;
      
      ctx.clearRect(0, 0, w, h);
      for (let i = 0; i < SEGMENT_COUNT; i++) {
        const start = currentRotation + i * ANGLE_PER_SEG;
        const end = start + ANGLE_PER_SEG;
        ctx.beginPath();
        ctx.arc(centerX, centerY, radius, start, end);
        ctx.lineTo(centerX, centerY);
        ctx.fillStyle = SEGMENTS[i].color;
        ctx.fill();
        ctx.strokeStyle = "white";
        ctx.lineWidth = 2.5;
        ctx.stroke();
        
        // نوشتن متن روی هر بخش
        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.rotate(start + ANGLE_PER_SEG / 2);
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        let fontSize = Math.max(12, radius / 11);
        ctx.font = `bold ${fontSize}px 'Vazirmatn'`;
        ctx.fillStyle = "#ffffff";
        ctx.shadowBlur = 3;
        ctx.shadowColor = "rgba(0,0,0,0.4)";
        let shortLabel = SEGMENTS[i].name;
        if (shortLabel.length > 8) shortLabel = shortLabel.slice(0,7)+"..";
        ctx.fillText(shortLabel, radius * 0.68, 0);
        ctx.restore();
      }
      // دایره مرکزی کوچک
      ctx.beginPath();
      ctx.arc(centerX, centerY, w * 0.1, 0, Math.PI * 2);
      ctx.fillStyle = "#fef3d6";
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = "#e2b87a";
      ctx.lineWidth = 2;
      ctx.stroke();
    }
    
    // ----- تعیین جایزه بر اساس نشانگر (زاویه ثابت -PI/2 یعنی ساعت 12) -----
    function getCurrentPrizeIndex() {
      // نشانگر در موقعیت بالای دایره: زاویه -PI/2
      const pointerAngle = -Math.PI / 2;
      let rawAngle = (pointerAngle - currentRotation + Math.PI * 2) % (Math.PI * 2);
      let idx = Math.floor(rawAngle / ANGLE_PER_SEG);
      return idx % SEGMENT_COUNT;
    }
    
    // ذخیره تاریخچه و نمایش نتیجه
    function showWinResult(prizeObj, idx) {
      let displayText = prizeObj.value;
      if (prizeObj.name === "چرخش مجدد") displayText = "چرخش مجدد! یک بار دیگر بچرخون 🎡";
      prizeDisplay.innerHTML = `<i class="fas fa-star" style="color:#f1c40f;"></i> ${displayText}`;
      prizeDisplay.classList.add('glow-text');
      setTimeout(() => prizeDisplay.classList.remove('glow-text'), 600);
      
      // نمایش کوپن یا پیام
      if (prizeObj.coupon && prizeObj.name !== "چرخش مجدد") {
        couponContainer.innerHTML = `
          <div class="coupon-box">
            <span style="direction: ltr;">${prizeObj.coupon}</span>
            <button class="copy-btn" data-coupon="${prizeObj.coupon}"><i class="fas fa-copy"></i> کپی</button>
          </div>
        `;
        const copyBtn = couponContainer.querySelector('.copy-btn');
        if (copyBtn) {
          copyBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const code = copyBtn.dataset.coupon;
            navigator.clipboard.writeText(code);
            showTemporaryNotif("✅ کد تخفیف کپی شد!");
          });
        }
      } else if (prizeObj.name === "چرخش مجدد") {
        couponContainer.innerHTML = `<div style="background:#ffe0b5; border-radius: 50px; padding: 8px 18px; display:inline-block;">🎲 شانس دوباره! دکمه را بزن 🎲</div>`;
      } else {
        couponContainer.innerHTML = `<div style="background:#e6d5b8; border-radius: 40px; padding: 6px 16px; font-size:0.9rem;">🎉 بدون کد - مستقیماً اعتبار دارد 🎉</div>`;
      }
      
      // افزودن به تاریخچه (حداکثر 8 آیتم)
      let historyItem = `${prizeObj.value} ${prizeObj.coupon ? `[${prizeObj.coupon}]` : ''}`;
      winnersHistory.unshift(historyItem);
      if (winnersHistory.length > 8) winnersHistory.pop();
      localStorage.setItem('wheelWinnersList', JSON.stringify(winnersHistory));
      updateHistoryUI();
      
      // اگر جایزه چرخش مجدد باشه، خودکار پیام میدیم (اختیاری)
      if (prizeObj.name === "چرخش مجدد") {
        showTemporaryNotif("✨ شانس دوباره! دکمه رو بزن دوباره بچرخونه ✨");
      }
    }
    
    // بروزرسانی بخش تاریخچه
    function updateHistoryUI() {
      if (!historyListDiv) return;
      if (!winnersHistory.length) {
        historyListDiv.innerHTML = '<span class="history-badge">هنوز برنده‌ای ثبت نشده</span>';
        return;
      }
      let html = '';
      winnersHistory.forEach(item => {
        html += `<div class="history-badge">🎁 ${item}</div>`;
      });
      historyListDiv.innerHTML = html;
    }
    
    // نوتیف موقت
    function showTemporaryNotif(msg) {
      const toast = document.createElement('div');
      toast.innerText = msg;
      toast.style.cssText = `position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:#1ac7db; color:#022e36; padding:10px 22px; border-radius:60px; font-weight:bold; z-index:9999; box-shadow:0 5px 15px black; backdrop-filter:blur(6px); font-size:0.9rem;`;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 2300);
    }
    
    // چرخش اصلی
    function startSpin() {
      if (isSpinning) return;
      isSpinning = true;
      
      // تعداد چرخش تصادفی (15 تا 30 دور)
      const extraTurns = Math.floor(Math.random() * 18) + 14; // 14 تا 32 دور
      const randomRad = Math.random() * Math.PI * 2;
      // هدف نهایی = چرخش تصادفی + زاویه اضافه برای توقف روی یک بخش تصادفی (اما عادلانه)
      // ولی چون میخوایم عادلانه باشه و همه بخش ها شانس برابر داشته باشند، تابع زیر توقف کاملاً تصادفی انجام میده
      const randomSegmentIndex = Math.floor(Math.random() * SEGMENT_COUNT);
      // هدف اینه که پس از چرخش، نشانگر روی بخش randomSegmentIndex قرار بگیره
      // زاویه هدف برای نشانگر: pointerAngle ثابت = -PI/2
      const targetSegmentCenter = (randomSegmentIndex * ANGLE_PER_SEG) + (ANGLE_PER_SEG/2);
      // معادله: نشانگر = -PI/2  و  currentRotation نهایی باید به گونه ای باشد که نشانگر روی center بخش بیفته
      // بخش مرکزی: نیاز داریم currentRotation نهایی به گونه ای باشد که:  (pointerAngle - finalRotation) ≡ targetSegmentCenter (mod 2PI)
      // => finalRotation ≡ pointerAngle - targetSegmentCenter (mod 2PI)
      let targetRotationRaw = (-Math.PI/2) - targetSegmentCenter;
      targetRotationRaw = ((targetRotationRaw % (Math.PI*2)) + (Math.PI*2)) % (Math.PI*2);
      const fullExtraRotation = extraTurns * (Math.PI*2);
      let finalTarget = targetRotationRaw + fullExtraRotation;
      
      startRot = currentRotation;
      targetRot = finalTarget;
      spinStartTime = performance.now();
      
      function step(now) {
        const elapsed = now - spinStartTime;
        let t = Math.min(1, elapsed / spinDuration);
        // ease out cubic
        const ease = 1 - Math.pow(1 - t, 3);
        const newRot = startRot + (targetRot - startRot) * ease;
        currentRotation = newRot % (Math.PI * 2);
        drawWheel();
        if (t < 1) {
          animFrame = requestAnimationFrame(step);
        } else {
          // چرخش تمام شد
          currentRotation = targetRotationRaw % (Math.PI * 2);
          drawWheel();
          const winnerIdx = getCurrentPrizeIndex();
          const prize = SEGMENTS[winnerIdx];
          showWinResult(prize, winnerIdx);
          isSpinning = false;
          cancelAnimationFrame(animFrame);
          animFrame = null;
          
          // اگر جایزه چرخش مجدد بود -> خودکار دوباره spin کنه؟ برای تجربه بهتر اخطار میدهیم و دستی باید بزنند. ولی میتونیم خودکار دوباره اجرا کنیم
          if (prize.name === "چرخش مجدد") {
            setTimeout(() => {
              if (!isSpinning) {
                startSpin();
              }
            }, 800);
          }
        }
      }
      if (animFrame) cancelAnimationFrame(animFrame);
      animFrame = requestAnimationFrame(step);
    }
    
    // بارگذاری تاریخچه از localStorage
    function loadHistory() {
      const saved = localStorage.getItem('wheelWinnersList');
      if (saved) {
        try {
          winnersHistory = JSON.parse(saved);
          if (!Array.isArray(winnersHistory)) winnersHistory = [];
        } catch(e) { winnersHistory = []; }
      } else {
        winnersHistory = [];
      }
      updateHistoryUI();
    }
    
    // ----- کپی داینامیک برای کوپن بعداً با event delegation -----
    function bindCouponCopy() {
      document.addEventListener('click', (e) => {
        const copyBtn = e.target.closest('.copy-btn');
        if (copyBtn && copyBtn.dataset.coupon) {
          navigator.clipboard.writeText(copyBtn.dataset.coupon);
          showTemporaryNotif("کد تخفیف کپی شد!");
        }
      });
    }
    
    // رویداد لمسی و موس (جلوگیری از کلیک همزمان در حین چرخش)
    spinBtn.addEventListener('click', (e) => {
      e.preventDefault();
      if (!isSpinning) startSpin();
      else showTemporaryNotif("لطفاً صبر کنید، گردونه در حال چرخش است!");
    });
    
    // ریسپانسیو کامل + تغییر سایز ویندوز
    window.addEventListener('resize', () => {
      resizeCanvasSize();
    });
    
    function init() {
      resizeCanvasSize();
      loadHistory();
      bindCouponCopy();
      // نمایش پیام خوش آمد
      prizeDisplay.innerHTML = "روی دکمه بچرخون بزن!";
      couponContainer.innerHTML = `<div style="font-size:0.8rem;">🎡 هر بار یک جایزه شگفت‌انگیز 🎡</div>`;
    }
    
    init();
  })();
</script>
